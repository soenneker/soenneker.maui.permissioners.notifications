name: codeql

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'test/**'
  workflow_dispatch:

env:
  NUGET_XMLDOC_MODE: skip

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: CodeQL Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore Android workload
        run: dotnet workload restore ./src/Soenneker.Maui.Permissioners.Notifications/Soenneker.Maui.Permissioners.Notifications.csproj -p:TargetFrameworks=net10.0-android --verbosity minimal

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore src
        run: dotnet restore ./src/Soenneker.Maui.Permissioners.Notifications/Soenneker.Maui.Permissioners.Notifications.csproj -p:TargetFrameworks=net10.0-android --verbosity minimal

      - name: Build src
        run: dotnet build ./src/Soenneker.Maui.Permissioners.Notifications/Soenneker.Maui.Permissioners.Notifications.csproj -p:TargetFrameworks=net10.0-android --configuration Release --no-restore --verbosity minimal

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: results

      - name: Preserve CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: results/*.sarif
          if-no-files-found: ignore

      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results
